name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release

    - name: Pack (all publishable libraries)
      # Packs every packable project in the solution - Abstractions, the core library and the Blazor
      # components. Packing only the core library would silently publish one of three packages.
      run: dotnet pack PanoramicData.Maps.slnx --no-build --configuration Release --output ./artifacts

    - name: Upload NuGet artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
        retention-days: 1

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: nuget
        path: ./artifacts
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: NuGet Login (Trusted Publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: david_n_m_bond
    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-docker:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Docker meta
      id: meta
      run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: PanoramicData.Maps.Server/Dockerfile
        push: true
        tags: |
          panoramicdata/maps:${{ steps.meta.outputs.version }}
          panoramicdata/maps:latest
